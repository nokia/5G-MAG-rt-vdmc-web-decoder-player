# Football, native reference encoder (encode.exe v16), AI/Intra, texture ON.
# Only options accepted by the native encoder are listed (verified against encode.exe --help
# and verification/levi_test/encoder.cfg which the native encoder parses cleanly).
# Geometry + texture video use the built-in HM HEVC codec (geometryVideoCodecId/textureVideoCodecId
# default to HM), producing standard HEVC substreams the web SDK's WebCodecs path can decode.
# minPosition/maxPosition are computed from the mesh and passed on the command line.

srcMesh: frame_%04d.obj
srcTex: frame_%04d.png
startFrameIndex: 445
frameCount: 1

positionBitDepth: 12
texCoordBitDepth: 13
target: 0.03
minCCTriangleCount: 0

# Geometry parametrization (AI/Intra)
ai_subdivIt: 3
ai_sdeform: 1
ai_forceNormalDisp: 0
ai_unifyVertices: 1
ai_deformNormalThres: -2.0
ai_deformNNCount: 1
ai_deformFlipThres: -2.0
ai_useInitialGeom: 1
ai_smoothMotion: 0
ai_smoothMethod: 1
subdivisionIterationCount: 3

# Measure displacements against barycentric-interpolated base-corner normals (not recomputed
# subdivided-geometry normals) so the direction matches the web SDK shader's normalize(N*bary).
interpolateSubdividedNormalsFlag: 1

# Base mesh
baseMeshPositionBitDepth: 11
baseMeshTexCoordBitDepth: 10
invertOrientation: 0
unifyVertices: 0

# Lifting / displacement (lower QP => stronger, more visible displacement)
liftingQP: 40,50,50
liftingBias: 0.3333,0.3333333333333333,0.3333333333333333

# Displacement packing block size (log2): 5 = 32x32 blocks.
log2GeometryVideoBlockSize: 5

# TransformMethod 0 = no wavelet/linear-lifting transform: a single displacement scale for all
# LoDs (matches the web SDK shader's plain d·scale reconstruction). Also disables per-LoD
# quantization and the lifting offset in the encoder.
transformMethod: 0

# Pack displacements forward (not reverse). Reverse packing reverses the block order over the FULL
# patch block count; the GPU shader packs forward, so keep them aligned by disabling it here.
displacementReversePacking: 0

# Disable the inverse-quantization liftingBias offset so the decoded displacement matches the
# web SDK shader (which applies a plain -0.5 signed offset, no liftingBias correction).
InverseQuantizationOffsetFlag: 0

# Texture video (built-in HM) — enabled so the SDK reaches full (displaced) mode
encodeTextureVideo: 1
textureVideoWidth: 1024
textureVideoHeight: 1024
textureVideoQP: 20
textureParameterizationType: 0

# Disable occupancy-map RDO so no _occmap.yuv is produced (simpler/faster texture pass)
useOccMapRDO: 0

# Misc
gofMaxSize: 256
analyzeGof: 1
